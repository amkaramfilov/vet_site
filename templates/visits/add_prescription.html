{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Добави рецепта - VetPlus{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1><i class="bi bi-capsule me-2"></i>Добави рецепта</h1>
        <p class="text-muted mb-0">
            Преглед: <a href="{% url 'visits:detail' visit.pk %}">{{ visit.patient.name }} - {{ visit.date|date:"d.m.Y" }}</a>
        </p>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <hr>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Запази
                            </button>
                            <a href="{% url 'visits:detail' visit.pk %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg me-1"></i>Отказ
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
